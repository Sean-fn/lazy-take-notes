# LLM provider: 'ollama' (default) or 'openai' (any OpenAI-compatible API)
llm_provider: ollama

ollama:
  #host: "http://localhost:11434"

# OpenAI-compatible provider (OpenAI, Gemini, Groq, Together, vLLM, etc.)
 openai:
   api_key: e61cd8addb8d4c26aa3ccc5e0f516e25.sflpqbxzhSJYIriGi2ImsXty           # or set OPENAI_API_KEY env var
   base_url: "https://ollama.com/api"

transcription:
  model: "large-v3-turbo-q8_0"    # default whisper model
  models:                         # per-locale overrides
    zh: "breeze-q8"               # Breeze ASR, optimized for Traditional Chinese
  chunk_duration: 25.0
  overlap: 1.0
  silence_threshold: 0.01
  pause_duration: 1.5
digest:
  model: "gpt-oss:20b-cloud"            # heavy model for periodic digests
  min_lines: 15
  min_interval: 60
  compact_token_threshold: 100000
interactive:
  model: "gpt-oss:20b-cloud"            # fast model for quick actions
output:
  directory: "./output"
  save_audio: true                # save recording.wav alongside transcript
